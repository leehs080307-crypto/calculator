<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글로벌 인공지능 스마트 단어장</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif; color: #333;
    }
    .container {
      width: min(900px, 92%); margin: 40px auto;
      background: #ffffff; border-radius: 24px; padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 28px; color: #1a237e; }
    .subtitle { text-align: center; color: #777; margin-bottom: 28px; font-size: 14px; }
    
    /* 인증 양식 영역 */
    .auth-box { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .auth-box h2 { margin-top: 0; font-size: 22px; text-align: center; color: #3f51b5; }
    
    input, select {
      height: 46px; padding: 0 14px; border: 1px solid #ddd;
      border-radius: 12px; font-size: 15px; outline: none; width: 100%;
    }
    input:focus, select:focus {
      border-color: #42a5f5; box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }
    
    /* 버튼 공통 가이드 디자인 */
    button {
      border: none; border-radius: 12px; padding: 0 16px; height: 46px;
      font-size: 15px; cursor: pointer; transition: 0.15s; font-weight: bold;
    }
    button:hover { transform: translateY(-2px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }
    
    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; }
    .add-btn { background: #1a237e; color: white; height: 46px; }
    .delete-btn { background: #ef5350; color: white; height: 35px; font-size: 13px; }
    .speak-btn {
      background: #e8eaf6; color: #3f51b5; border: 1px dashed #3f51b5;
      padding: 4px 10px; height: auto; font-size: 13px; border-radius: 6px; margin-left: 6px;
    }
    .speak-btn:hover { background: #c5cae9; }

    .form-box {
      display: grid; grid-template-columns: 1.2fr 2fr auto; gap: 10px; margin-bottom: 22px;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 22px; padding: 14px; border-radius: 16px; background: #f7f9fb;
    }
    .status { min-height: 24px; margin-bottom: 14px; color: #1e88e5; font-size: 14px; font-weight: bold; }
    
    /* 단어 보관 리스트 카드 아이템 */
    .list { display: flex; flex-direction: column; gap: 12px; }
    .item {
      display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
      padding: 18px; border-radius: 16px; background: #f7f9fb; border: 1px solid #edf1f5;
    }
    .item-word-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .item-title { margin: 0; font-size: 20px; font-weight: bold; color: #1b5e20; }
    .item-origin { font-size: 14px; color: #666; }
    .item-lang { background: #e0f2f1; color: #004d40; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .item-content { margin: 6px 0 0; color: #333; font-size: 15px; }
    .pronounce-tag { color: #d32f2f; font-weight: bold; background: #ffebee; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .korean-tag { color: #ff6f00; font-weight: bold; font-size: 14px; }
    .item-date { margin-top: 8px; font-size: 12px; color: #999; }
    
    .empty { text-align: center; padding: 40px; color: #888; background: #f7f9fb; border-radius: 16px; }
    .hidden { display: none; }
    .notice { max-width: 420px; margin: 20px auto 0; padding: 12px; border-radius: 12px; background: #fff8e1; color: #5d4037; font-size: 13px; text-align: center; }

    @media (max-width: 700px) {
      .form-box, .item, .top-bar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 글로벌 AI 스마트 단어장</h1>
    <div class="subtitle">Firebase + OpenAI GPT-4o mini 다국어 변환 통계 교재 시스템</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>사용자 로그인</h2>
        <input id="emailInput" type="email" placeholder="이메일 주소 입력" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="login-btn" id="loginBtn">서비스 로그인</button>
        <button class="signup-btn" id="signupBtn">신규 디자이너 회원가입</button>
      </div>
      <div class="notice">가입한 이력이 없다면 회원가입 버튼을 먼저 눌러주세요.</div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">접속 학습자 계정: <strong id="userEmail"></strong></div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="form-box">
        <select id="langSelect">
          <option value="영어">영어 (English)</option>
          <option value="일본어">일본어 (日本語)</option>
          <option value="독일어">독일어 (Deutsch)</option>
          <option value="라틴어">라틴어 (Lingua Latina)</option>
        </select>
        <input id="wordInput" type="text" placeholder="변환할 한국어 단어를 입력하세요 (예: 자동차)" />
        <button class="add-btn" id="addBtn">AI 단어 생성 및 저장</button>
      </div>

      <div id="status" class="status">시스템 대기 중...</div>
      
      <h2 style="font-size:18px; color:#1a237e; border-bottom:2px solid #1a237e; padding-bottom:6px; margin-top:30px;">나의 원격 클라우드 단어장 보관함</h2>
      <div id="dataList" class="list"></div>
    </section>
  </div>

  <audio id="globalAudioPlayer" class="hidden"></audio>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, remove, onValue, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 요청하신 파이어베이스 웹 앱 school-1404a 스펙 적용 완료
    const firebaseConfig = {
      apiKey: "AIzaSyDFH_9Pa7aalUp_7sXRMnC8yfyY3JW567A",
      authDomain: "school-1404a.firebaseapp.com",
      databaseURL: "https://school-1404a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "school-1404a",
      storageBucket: "school-1404a.firebasestorage.app",
      messagingSenderId: "1071947727241",
      appId: "1:1071947727241:web:935c2cdf974129c756a158",
      measurementId: "G-JDDZ7B9VHK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // 신규 제공해주신 전용 앱스스크립트 고유 URL 연동 완료
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZznpEkR84WgVUVYWufh7zc6dKsGgy2si6cm2N2vYRjV5zckacnhpKWzRmLYuaEKqgfw/exec';

    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');
    
    const langSelect = document.getElementById('langSelect');
    const wordInput = document.getElementById('wordInput');
    const addBtn = document.getElementById('addBtn');
    const statusBox = document.getElementById('status');
    const dataList = document.getElementById('dataList');
    const globalAudioPlayer = document.getElementById('globalAudioPlayer');

    let currentUser = null;
    let currentItemsRef = null;

    // Firebase Auth 제어부
    signupBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const pw = passwordInput.value.trim();
      if(!email || pw.length < 6) return alert('올바른 이메일과 6자리 이상의 패스워드를 구성하세요.');
      try {
        await createUserWithEmailAndPassword(auth, email, pw);
        alert('성공적으로 데이터베이스 유저가 생성되었습니다.');
      } catch (err) { alert('가입 오류: ' + err.message); }
    });

    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const pw = passwordInput.value.trim();
      if(!email || !pw) return alert('정보를 기입하세요.');
      try {
        await signInWithEmailAndPassword(auth, email, pw);
      } catch (err) { alert('로그인 실패: 정보를 다시 확인하세요.'); }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        userEmail.textContent = user.email;
        startRealtimeListener(user.uid);
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
        stopRealtimeListener();
      }
    });

    // OpenAI 기반 단어 생성 프로세스 컨트롤러
    addBtn.addEventListener('click', async () => {
      if (!currentUser) return;
      const word = wordInput.value.trim();
      const targetLang = langSelect.value;

      if (!word) return alert('변환하고 싶은 한국어 단어를 기입해 주세요.');

      try {
        addBtn.disabled = true;
        statusBox.textContent = `OpenAI 인공지능 번역 및 발음 체계 추출 구동 중 (${targetLang})...`;

        // 1단계: GAS를 거쳐 OpenAI GPT-4o mini 데이터 수집 요청
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'translate',
            word: word,
            language: targetLang
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        statusBox.textContent = '클라우드 Realtime DB에 가공된 단어장을 동기화 중입니다.';

        // 2단계: 수집된 결과 모델을 파이어베이스에 업로드 보관
        const itemsRef = ref(database, `users/${currentUser.uid}/items`);
        const newItemRef = push(itemsRef);
        await set(newItemRef, {
          targetLanguage: targetLang,
          koreanWord: word,
          translatedWord: data.translated,
          phoneticSymbol: data.phonetic,
          koreanPronunciation: data.koreanPronunciation,
          createdAt: new Date().toLocaleString('ko-KR')
        });

        wordInput.value = '';
        statusBox.textContent = '성공적으로 단어가 추가 및 저장되었습니다!';
      } catch (err) {
        console.error(err);
        statusBox.textContent = '단어 생성 실패.';
        alert('에러가 발생했습니다: ' + JSON.stringify(err));
      } finally {
        addBtn.disabled = false;
      }
    });

    // 파이어베이스 실시간 데이터 수신 및 빌드업
    function startRealtimeListener(uid) {
      stopRealtimeListener();
      currentItemsRef = ref(database, `users/${uid}/items`);
      onValue(currentItemsRef, (snapshot) => {
        const data = snapshot.val();
        renderVocabulary(data);
      });
    }

    function stopRealtimeListener() {
      if (currentItemsRef) { off(currentItemsRef); currentItemsRef = null; }
    }

    function renderVocabulary(data) {
      dataList.innerHTML = '';
      if (!data) {
        dataList.innerHTML = '<div class="empty">보관된 나만의 단어가 없습니다. 상단에서 추가해보세요!</div>';
        return;
      }

      Object.entries(data).reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        
        // 발음 표기 및 한국어 독음 결합 레이아웃 구성
        div.innerHTML = `
          <div>
            <div class="item-word-row">
              <span class="item-lang">${item.targetLanguage}</span>
              <p class="item-title">${escapeHTML(item.translatedWord)}</p>
              <span class="item-origin">뜻: ${escapeHTML(item.koreanWord)}</span>
            </div>
            <p class="item-content">
              발음 기호: <span class="pronounce-tag">${escapeHTML(item.phoneticSymbol)}</span> 
              <button class="speak-btn" onclick="playTextSpeech('${escapeJS(item.translatedWord)}')">🔊 발음 듣기</button>
              &nbsp;|&nbsp; 한국어 독음: <span class="korean-tag">[ ${escapeHTML(item.koreanPronunciation)} ]</span>
            </p>
            <div class="item-date">기록일시: ${item.createdAt}</div>
          </div>
          <div>
            <button class="delete-btn" onclick="deleteWord('${id}')">삭제</button>
          </div>
        `;
        dataList.appendChild(div);
      });
    }

    // OpenAI 고품질 인공지능 원어민 음성 재생 처리기 (TTS)
    window.playTextSpeech = async function(text) {
      statusBox.textContent = `🗣️ '${text}' 발음 음성을 AI가 생성 중입니다...`;
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ type: 'tts', text: text })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // base64 형태 데이터를 브라우저에서 읽을 수 있는 임시 오디오 URL 객체로 변환
        const audioUrl = base64ToAudioUrl(data.audioBase64, 'audio/mpeg');
        globalAudioPlayer.src = audioUrl;
        globalAudioPlayer.play();
        statusBox.textContent = `재생 완료: "${text}"`;
      } catch (err) {
        alert('TTS 생성에 실패했습니다: ' + err.message);
        statusBox.textContent = '음성 안내 처리 실패.';
      }
    };

    window.deleteWord = async function(id) {
      if(!currentUser || !confirm('단어장에서 이 단어를 영구히 삭제할까요?')) return;
      await remove(ref(database, `users/${currentUser.uid}/items/${id}`));
    };

    function base64ToAudioUrl(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) byteNumbers[i] = slice.charCodeAt(i);
        byteArrays.push(new Uint8Array(byteNumbers));
      }
      return URL.createObjectURL(new Blob(byteArrays, { type: mimeType }));
    }

    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    function escapeJS(text) {
      return String(text).replaceAll("'", "\\'").replaceAll('"', '\\"');
    }

    // 엔터키 입력 시 데이터 추가 가동 편의기능
    wordInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') addBtn.click();
    });
  </script>
</body>
</html>
